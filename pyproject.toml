[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mabinogi-m-fishing-helper"
version = "0.5.7.4"
description = "Local screen-based fishing helper for Mabinogi M"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mss==10.2.0",
  "numpy==2.5.2",
  "opencv-python==5.0.0.93",
  "PyAutoGUI==0.9.54",
  "pynput==1.8.2",
  "PySide6==6.10.2",
  "ok-script[default]==2.0.6",
]

[project.scripts]
mabinogi-fishing-helper = "fishing_assistant.app:main"

[tool.setuptools]
py-modules = ["mabinogi_fishing_helper"]

[tool.setuptools.packages.find]
include = ["fishing_assistant*"]
